<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slaw Skyblock Tracker</title><style>
:root{--bg:#141a22;--card:#1d2530;--card2:#232d3a;--line:#2f3b4b;--tx:#e6edf3;--mut:#8b9bb0;--grass:#5dbb3a;--dirt:#8a5a34}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#22303f,var(--bg));color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:32px 18px 60px}
header{display:flex;gap:18px;align-items:center;margin-bottom:22px}
.logo{width:56px;height:56px;border-radius:8px;background:linear-gradient(var(--grass) 0 35%,var(--dirt) 35%);box-shadow:inset 0 0 0 3px #0003,0 6px 20px #0006;image-rendering:pixelated;flex:none}
h1{margin:0;font-size:26px;letter-spacing:.5px}h1 span{color:#ffd54a}.sub{color:var(--mut);font-size:13px}
.overall{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
.ovtop{display:flex;justify-content:space-between;align-items:baseline}.pct{font-size:34px;font-weight:800;color:#ffd54a}
.bar{height:12px;background:#0d1218;border-radius:6px;overflow:hidden;border:1px solid var(--line);margin-top:8px}.bar>i{display:block;height:100%;background:repeating-linear-gradient(90deg,#5dbb3a 0 14px,#4ea32f 14px 28px);transition:width .6s}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.legend button{cursor:pointer;border:1px solid transparent}.legend button.off{opacity:.35}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:14px 18px;display:grid;grid-template-columns:1fr 160px 48px;gap:14px;align-items:center}summary::-webkit-details-marker{display:none}
summary h2{margin:0;font-size:16px}summary h2:before{content:"▸ ";color:var(--mut)}details[open] summary h2:before{content:"▾ "}
summary .bar{margin:0;height:9px}summary .n{color:var(--mut);font-size:13px;text-align:right}
ul{list-style:none;margin:0;padding:0 10px 10px}li{display:flex;gap:12px;align-items:flex-start;padding:10px 8px;border-top:1px solid var(--line)}li:hover{background:var(--card2)}
li .pill{flex:none;width:150px;text-align:center}li .t{flex:1}a{color:#7cc4ff;text-decoration:none}a:hover{text-decoration:underline}.iss{color:var(--mut);font-size:13px;flex:none}
footer{color:var(--mut);font-size:12px;text-align:center;margin-top:24px}
@media(max-width:640px){summary{grid-template-columns:1fr 70px}summary .n{display:none}li{flex-wrap:wrap}li .pill{width:auto}}
</style></head><body><div class="wrap">
<header><div class="logo"></div><div><h1 id="title">Slaw <span>Skyblock</span> Tracker</h1><div class="sub" id="sub"></div></div></header>
<div class="overall"><div class="ovtop"><b>Overall completion</b><span class="pct" id="pct">0%</span></div><div class="bar"><i id="ovbar" style="width:0"></i></div>
<div class="sub" id="counts" style="margin-top:6px"></div><div class="legend" id="legend"></div></div>
<div id="areas"></div><footer>Edit <code>status.json</code> to update this page. Progress: Done = 100%, Built, not deployed = 75%, In progress = 40%, others = 0%.</footer></div>
<script>
const FALLBACK={"title": "Slaw Skyblock Completion Tracker", "updated": "2026-11-01", "statuses": ["Done", "Built, not deployed", "In progress", "Waiting on Cole", "Brainstorming", "To do"], "areas": [{"name": "Part 1: Names & item updates", "items": [{"status": "Done", "text": "Summoning Eye → Ender Catalyst, internal ID renamed with legacy ID alias"}, {"status": "Done", "text": "RNG Meter rename"}, {"status": "Done", "text": "Titan's armor, blade and heads rename"}, {"status": "Done", "text": "Item removals: Mega Luck Charm, Warlord items, Radiant reforge, Lucky Dice, Rag Doll, Herbalist/Bat masks, Lifeline Bow, Harvester items", "issue": 1, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/1"}, {"status": "Done", "text": "Remove Cloth Scrap, Sweeper's Broomstick, Bat Fang, Warlord slayer title, and everything Sadan", "issue": 25, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/25"}, {"status": "Done", "text": "Mob renames: Ender Sentinel, Voidling Brute/Warden, Voidgloom Colossus, Crypt Zombie", "issue": 2, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/2"}, {"status": "Done", "text": "Zombie slayer line renamed Iron Brute", "issue": 26, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/26"}, {"status": "Done", "text": "Tier-5 zombie slayer boss renamed Iron Brute Overlord"}, {"status": "Done", "text": "Tier-5 minibosses renamed Iron Brute Enforcer and Iron Brute Champion"}, {"status": "Done", "text": "Slayer drop renamed Brute Trophy (existing items carry over)"}]}, {"name": "Part 2: Less grind", "items": [{"status": "Done", "text": "64 per enchanted recipe everywhere (219 recipes + compactor verified)"}, {"status": "Done", "text": "Bug: Enchanted Lava Bucket recipe outputs Enchanted Iron", "issue": 4, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/4"}, {"status": "Done", "text": "Bug: Enchanted Charcoal made from Coal", "issue": 5, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/5"}, {"status": "Done", "text": "Bug: Enchanted Fermented Spider Eye / Eye of Ender single-ingredient recipes", "issue": 6, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/6"}, {"status": "Done", "text": "Bug: Super Compactor Enchanted Bone Block typo", "issue": 7, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/7"}, {"status": "Done", "text": "Bug: compactor uses 64 blocks (576 diamonds) per enchanted item", "issue": 8, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/8"}, {"status": "Done", "text": "Bug: 48 enchanted items have no crafting recipe", "issue": 9, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/9"}, {"status": "Done", "text": "Bug: pet XP table skips levels 28/53/78", "issue": 11, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/11"}, {"status": "Done", "text": "Enchanted Ender Pearl now 16 (recipe + compactor)", "issue": 10, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/10"}, {"status": "Done", "text": "Rescale enchanted NPC sell prices (input-based, never above bazaar sell)", "issue": 12, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/12"}, {"status": "To do", "text": "Skill XP curve L16+: halve L16-30, ~1/3 for L31-60, keep 1.25x", "issue": 13, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/13"}, {"status": "To do", "text": "Halve outlier collections (Redstone, Gemstone, Mithril, Hard Stone, Iron, Ghast Tear)", "issue": 14, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/14"}, {"status": "Built, not deployed", "text": "Slayer costs halved", "issue": 15, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/15"}, {"status": "To do", "text": "Minions ~30% faster", "issue": 16, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/16"}, {"status": "To do", "text": "Review reforge costs, NPC buy prices, Kat", "issue": 17, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/17"}]}, {"name": "Part 3: Economy & systems design", "items": [{"status": "Done", "text": "Economy: Hypixel base-item prices, weekly snapshot, buy/sell spread; checker PASS, zero profit loops", "issue": 27, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/27"}, {"status": "Done", "text": "Dandelion and Poppy priced at 5 coins"}, {"status": "Done", "text": "Hypixel price sync working without an API key (live snapshot fetched on deploy)"}, {"status": "Brainstorming", "text": "Fairy Souls redesign (174 souls now, 5 per Tia exchange)", "issue": 28, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/28"}]}, {"name": "Part 4: Wiki", "items": [{"status": "To do", "text": "Hypixel-style wiki on GitHub Pages", "issue": 18, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/18"}, {"status": "To do", "text": "Crafting-grid recipe pages", "issue": 19, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/19"}, {"status": "To do", "text": "Guides and drop odds", "issue": 20, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/20"}, {"status": "To do", "text": "Player profile viewer from periodic Mongo stats export (no direct DB access)", "issue": 21, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/21"}, {"status": "To do", "text": "Next-step recommendations", "issue": 22, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/22"}]}, {"name": "Part 5: Deployment", "items": [{"status": "Done", "text": "Deployed to hub + island (Nov 1, economy3 build; live jars backed up first)", "issue": 23, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/23"}]}, {"name": "Security", "items": [{"status": "Waiting on Cole", "text": "Security housekeeping (private notes)", "issue": 24, "url": "https://github.com/ColeMcClintock/slaw-skyblock-tracker/issues/24"}]}]};
const COL={"Done":["#1f6f2e","#b9f6c5"],"Built, not deployed":["#1d4f7a","#bfe3ff"],"In progress":["#7a5a12","#ffe8a3"],"Waiting on Cole":["#6b2d6b","#f5c2f5"],"Brainstorming":["#235b5b","#b8f0ee"],"To do":["#3a4452","#d0d8e2"]};
const W={"Done":1,"Built, not deployed":.75,"In progress":.4};const hidden=new Set();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pill=s=>{const c=COL[s]||COL["To do"];return `<span class="pill" style="background:${c[0]};color:${c[1]}">${esc(s)}</span>`};
const prog=it=>it.length?Math.round(100*it.reduce((a,x)=>a+(W[x.status]||0),0)/it.length):0;
function render(d){
 document.getElementById("sub").textContent="Status of completing Slaw Skyblock · updated "+d.updated;
 const all=d.areas.flatMap(a=>a.items),p=prog(all);
 document.getElementById("pct").textContent=p+"%";setTimeout(()=>ovbar.style.width=p+"%",50);
 const cnt={};all.forEach(x=>cnt[x.status]=(cnt[x.status]||0)+1);
 document.getElementById("counts").textContent=all.length+" items · "+d.statuses.filter(s=>cnt[s]).map(s=>cnt[s]+" "+s).join(" · ");
 legend.innerHTML=d.statuses.map(s=>`<button data-s="${esc(s)}" class="pill ${hidden.has(s)?"off":""}" style="background:${COL[s][0]};color:${COL[s][1]}">${esc(s)} (${cnt[s]||0})</button>`).join("");
 legend.querySelectorAll("button").forEach(b=>b.onclick=()=>{const s=b.dataset.s;hidden.has(s)?hidden.delete(s):hidden.add(s);render(d)});
 const open=[...document.querySelectorAll("details")].map(x=>x.open);
 areas.innerHTML=d.areas.map((a,i)=>{const q=prog(a.items),done=a.items.filter(x=>x.status=="Done").length;
  return `<section><details ${open.length?(open[i]?"open":""):"open"}><summary><h2>${esc(a.name)}</h2><div class="bar"><i style="width:${q}%"></i></div><span class="n">${q}%</span></summary><ul>${
  a.items.filter(x=>!hidden.has(x.status)).map(x=>`<li>${pill(x.status)}<span class="t">${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a>`:esc(x.text)}</span>${x.issue?`<a class="iss" href="${esc(x.url)}" target="_blank" rel="noopener">#${x.issue}</a>`:""}</li>`).join("")}</ul></details></section>`}).join("");
}
fetch("status.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(render).catch(()=>render(FALLBACK));
</script></body></html>
